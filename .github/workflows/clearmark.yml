name: ClearMark bauen

on:
  push:
    paths:
      - "clearmark/**"
      - ".github/workflows/clearmark.yml"
  workflow_dispatch:

concurrency:
  group: clearmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit-Tests
        working-directory: clearmark
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Debug-APK bauen
        working-directory: clearmark
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClearMark-testberichte
          path: clearmark/app/build/reports/tests/
          if-no-files-found: ignore

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ClearMark-debug-apk
          path: clearmark/app/build/outputs/apk/debug/*.apk
