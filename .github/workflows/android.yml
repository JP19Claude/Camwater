name: Android-App bauen

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: APK bereitlegen
        run: cp android/app/build/outputs/apk/release/app-release.apk Camwater.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Camwater-apk
          path: Camwater.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: Camwater 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: Camwater.apk
          body: |
            **Installieren:** Auf dem Handy unten auf **Camwater.apk** tippen, herunterladen und öffnen.
            Beim ersten Mal fragt Android, ob Chrome „unbekannte Apps installieren“ darf – einmal erlauben.

            **Benutzen:** Camwater öffnen, Watermark wählen (z.B. vivo X300 Ultra) und den Schalter oben auf **AN** stellen.
            Danach ganz normal mit der Samsung-Kamera fotografieren – jedes neue Foto bekommt automatisch eine Kopie mit Watermark (Album „Camwater“).
